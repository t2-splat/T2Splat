# Configuration maintenance: zhtang2004@gmail.com
# Per-scene best completed DTU results as of 2026-10-15:
# reports/dtu_best_results_20261015.csv
# Default: normals 1e-5, final visibility > 0.6. Exceptions are listed below.
# This is a mixed per-scene preset, not the uniform visibility-0.6 benchmark.

data:
  root: ../datasets/DTU
  gt_root: ../datasets/DTU
  output: output/dtu
  layout: '{scene}'

pipeline:
  texture: false
  image_metrics: false
  export_mesh: true
  geometry_eval: dtu
  mesh_clean: true
  mesh_manifold: false

training:
  iterations: 20000
  sigma_until: 30000
  final_opacity_iter: 24000
  start_upsampling: 20000
  feature_lr: 0.004
  size_probs_zero: 0.0
  splitt_large_triangles: 500
  start_pruning: 3000
  weight_lr: 0.05
  lambda_weight: 0.0
  prune_size: 1300
  densify_until_iter: 10000
  run_restricted_delaunay: 11000
  iteration_mesh: 8000
  # Retain normal consistency, but disable external normal/depth supervision.
  lambda_normals: 1.0e-05
  lambda_normals_super: 0.0
  depth_lambda_init: 0.0
  depth_lambda_final: 0.0
  lambda_vertex: 0.0
  lr_triangles_points_init: 0.00052
  prune_triangles_threshold: 0.17
  white_background: true
  enable_heartbeat: true
  heartbeat_start_iter: 12000
  heartbeat_end_iter: 18000
  heartbeat_interval: 1000
  heartbeat_collapse_ratio: 0.05
  heartbeat_split_top_k: 5.0
  heartbeat_safety: true
  heartbeat_max_edge_len_ratio: 2.0
  rdt_backend: legacy
  visibility_pruning: legacy
  final_visibility_threshold: 0.6
  # Keep scalar logging and event/final audits; full evaluation only at 20k.
  final_only_monitoring: true
  topology_monitor_interval: 1000
  save_iterations: [12000, 18000, 20000]
  save_topology_snapshots: true

texture:
  face_tex_res: 4
  stage2_iterations: 2000
  lr_face_texture: 0.005
  lr_decay_start: 500
  use_mip_texture: false

scene_defaults:
  kind: dtu
  images: images
  max_points: 650000

scenes:
  scan24: {}
  scan37: {}
  scan40: {}
  scan55: {}
  scan63:
    training:
      lambda_normals: 1.0e-06
      final_visibility_threshold: 0.5
  scan65:
    training:
      prune_triangles_threshold: 0.14
      final_visibility_threshold: 0.5
  scan69: {}
  scan83: {}
  scan97:
    training:
      final_visibility_threshold: 0.5
  scan105: {}
  scan106: {}
  scan110: {}
  scan114: {}
  scan118: {}
  scan122: {}
